<svg xmlns="http://www.w3.org/2000/svg" width="800" height="371" viewBox="0 0 800 371">
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .cursor { animation: blink 1s steps(1) infinite }
    @keyframes tchip0 { 0%,0% { opacity: 0 } 2%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip0 { animation: tchip0 21s ease-out infinite; }
    @keyframes tchip1 { 0%,2% { opacity: 0 } 4%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip1 { animation: tchip1 21s ease-out infinite; }
    @keyframes tchip2 { 0%,3% { opacity: 0 } 5%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip2 { animation: tchip2 21s ease-out infinite; }
    @keyframes tchip3 { 0%,5% { opacity: 0 } 7%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip3 { animation: tchip3 21s ease-out infinite; }
    @keyframes tchip4 { 0%,7% { opacity: 0 } 9%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip4 { animation: tchip4 21s ease-out infinite; }
    @keyframes tchip5 { 0%,8% { opacity: 0 } 10%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip5 { animation: tchip5 21s ease-out infinite; }
    @keyframes tchip6 { 0%,10% { opacity: 0 } 12%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip6 { animation: tchip6 21s ease-out infinite; }
    @keyframes tchip7 { 0%,12% { opacity: 0 } 14%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip7 { animation: tchip7 21s ease-out infinite; }
    @keyframes tchip8 { 0%,13% { opacity: 0 } 15%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip8 { animation: tchip8 21s ease-out infinite; }
    @keyframes tchip9 { 0%,15% { opacity: 0 } 17%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip9 { animation: tchip9 21s ease-out infinite; }
    @keyframes tchip10 { 0%,17% { opacity: 0 } 19%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip10 { animation: tchip10 21s ease-out infinite; }
    @keyframes tchip11 { 0%,18% { opacity: 0 } 20%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip11 { animation: tchip11 21s ease-out infinite; }
    @keyframes tchip12 { 0%,20% { opacity: 0 } 22%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip12 { animation: tchip12 21s ease-out infinite; }
    @keyframes tchip13 { 0%,22% { opacity: 0 } 24%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip13 { animation: tchip13 21s ease-out infinite; }
    @keyframes tchip14 { 0%,23% { opacity: 0 } 25%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip14 { animation: tchip14 21s ease-out infinite; }
    @keyframes tchip15 { 0%,25% { opacity: 0 } 27%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip15 { animation: tchip15 21s ease-out infinite; }
    @keyframes tchip16 { 0%,27% { opacity: 0 } 29%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip16 { animation: tchip16 21s ease-out infinite; }
    @keyframes tchip17 { 0%,28% { opacity: 0 } 30%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip17 { animation: tchip17 21s ease-out infinite; }
    @keyframes tchip18 { 0%,30% { opacity: 0 } 32%,92% { opacity: 1 } 97%,100% { opacity: 0 } }
    .tchip18 { animation: tchip18 21s ease-out infinite; }
  </style>
  <rect width="100%" height="100%" fill="#0a0a0a" rx="14" ry="14"/>
  
  <rect x="0" y="0" width="800" height="28" fill="#0a0a0a" rx="14" ry="14"/>
  <rect x="0" y="14" width="800" height="14" fill="#0a0a0a"/>
  <line x1="0" y1="28" x2="800" y2="28" stroke="#5a5a64" stroke-width="0.5" stroke-opacity="0.4"/>
  <g opacity="0.55">
    <circle cx="22" cy="14" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="14" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="14" r="5.5" fill="#28c840"/>
  </g>
  <text x="400" y="15" fill="#5a5a64" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">~/skills</text>

  <!-- Command line -->
  <text x="40" y="76.5" fill="#4ade80" font-size="14" dominant-baseline="middle">$</text>
  <text x="62" y="76.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">which --skills</text>

  <!-- Output marker -->
  <text x="40" y="99.5" fill="#5a5a64" font-size="14" dominant-baseline="middle">→</text>
  <text x="62" y="99.5" fill="#5a5a64" font-size="14" dominant-baseline="middle">19 matches</text>

  <!-- Chips -->
  <text class="tchip0" x="62" y="138.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ IT Support ]</text>
  <text class="tchip1" x="188" y="138.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ Network Engineer ]</text>
  <text class="tchip2" x="364" y="138.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ Routing ]</text>
  <text class="tchip3" x="464" y="138.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ Switching ]</text>
  <text class="tchip4" x="581" y="138.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ OSPF ]</text>
  <text class="tchip5" x="656" y="138.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ RIP ]</text>
  <text class="tchip6" x="62" y="173.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ RIPv2 ]</text>
  <text class="tchip7" x="146" y="173.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ EIGRP ]</text>
  <text class="tchip8" x="230" y="173.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ BGP ]</text>
  <text class="tchip9" x="297" y="173.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ Firewall ]</text>
  <text class="tchip10" x="406" y="173.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ DHCP ]</text>
  <text class="tchip11" x="481" y="173.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ DNS Configuration ]</text>
  <text class="tchip12" x="62" y="208.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ PC Troubleshooting ]</text>
  <text class="tchip13" x="255" y="208.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ Installation OS ]</text>
  <text class="tchip14" x="423" y="208.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ Bandwidth Management ]</text>
  <text class="tchip15" x="62" y="243.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ NMS (Network Monitoring System) ]</text>
  <text class="tchip16" x="364" y="243.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ Email Management ]</text>
  <text class="tchip17" x="540" y="243.5" fill="#18fb1c" font-size="14" dominant-baseline="middle">[ Server Migration ]</text>
  <text class="tchip18" x="62" y="278.5" fill="#4ade80" font-size="14" dominant-baseline="middle">[ PC Maintenance ]</text>
  

  <!-- Trailing prompt + cursor -->
  <text x="40" y="332.5" fill="#4ade80" font-size="14" dominant-baseline="middle">$</text>
  <rect class="cursor" x="62" y="324" width="8" height="15" fill="#18fb1c"/>
</svg>